; PlatformIO Project Configuration File
;
; Papilio RetroCade - Wishbone Project Template
;
; PlatformIO includes library files for both targets.
; Wire peripherals in top.v and use their drivers in main.cpp.
;
; For more information: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32, fpga

; ==============================================================================
; ESP32-S3 Firmware Build
; ==============================================================================
[env:esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio
board_build.psram_type = qio
board_upload.flash_size = 4MB
board_upload.maximum_size = 1572864
board_build.partitions = partitions_papilio.csv
board_build.app_partition_name = ota_0
platform_packages =
    tool-papilio-upload = https://github.com/Papilio-Labs/platform-gowin.git#v1.2.0
    platformio/tool-esptoolpy @ ~2.40900.0
extra_scripts = post:scripts/papilio_upload.py
upload_protocol = custom
custom_papilio_transport = serial
; Network alternative: custom_papilio_transport = ota
; custom_papilio_host = 192.168.1.100
; custom_papilio_enter_via_usb = yes
; upload_port = COM10

build_flags = -I include
              -DARDUINO_USB_CDC_ON_BOOT=1
              -DBOARD_HAS_PSRAM
              -DENABLE_PAPILIO_OS

board_build.filesystem = littlefs

; Serial monitor configuration
monitor_speed = 115200
monitor_filters = 
    esp32_exception_decoder

; Library dependencies
; Core libraries (required for Wishbone communication):
lib_deps =
    https://github.com/Papilio-Labs/papilio_spi_slave.git
    https://github.com/Papilio-Labs/papilio_wishbone_bus.git
    https://github.com/Papilio-Labs/papilio_os.git
    https://github.com/Papilio-Labs/papilio_wishbone_register.git
    ; Add additional Papilio peripheral libraries below:
    ; https://github.com/Papilio-Labs/papilio_wishbone_rgb_led.git
    ; https://github.com/Papilio-Labs/papilio_wishbone_bram.git

; ==============================================================================
; FPGA Gateware Build
; ==============================================================================
[env:fpga]
platform = https://github.com/Papilio-Labs/platform-gowin.git#v1.2.0
board = papilio_retrocade_fpga
framework = hdl
lib_deps = ${env:esp32.lib_deps}

; Dual-purpose pin configuration
; Uncomment to use dedicated pins as regular I/O
board_build.use_sspi_as_gpio = 1
; board_build.use_mspi_as_gpio = 1
; board_build.use_jtag_as_gpio = 1  ; WARNING: Can brick your board! Only enable if you have alternative programming method
; board_build.use_ready_as_gpio = 1
; board_build.use_done_as_gpio = 1

; FPGA-specific configuration
; board_build.fpga_project = fpga/project.gprj

; Upload protocol for FPGA
upload_protocol = papilio_serial
; Network alternative: upload_protocol = papilio_ota
; custom_papilio_host = 192.168.1.100
; custom_papilio_enter_via_usb = yes
; Leave the loader running when uploading ESP firmware immediately afterward:
; custom_papilio_stay_in_loader = yes